name: Build

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read

    strategy:
      matrix:
        os: [windows-2022]
        arch: [x64]
        mode: [release]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    steps:
    - uses: actions/checkout@v4
    - run: |
        git fetch --prune --unshallow --tags

    - name: Checkout submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --force --recursive --depth=1

    # Force xmake to a specific folder (for cache)
    #- name: Set xmake env
    #  run: echo "XMAKE_GLOBALDIR=$(pwd)/xmake-global" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # Install xmake
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: '2.9.9'

    # Update xmake repository (in order to have the file that will be cached)
    - name: Update xmake repository
      run: xmake.exe repo --update

    # Setup compilation mode and install project dependencies
    - name: Configure xmake and install dependencies
      timeout-minutes: 30
      run: xmake.exe config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --yes

    # Install the result files
    - name: Build and create package
      run: xmake.exe package

    # Upload artifacts
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}
        path: |
          package/**
          !package/**/*.pdb
    
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}-pdb
        path: package/**/*.pdb

  publish:
    name: Publish Chinese release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
    - name: Download release package
      uses: actions/download-artifact@v4
      with:
        name: windows-2022-x64-release
        path: release-package

    - name: Create release ZIP
      shell: pwsh
      run: Compress-Archive -Path release-package/* -DestinationPath "CyberEngineTweaks-${{ github.ref_name }}-zh-CN.zip"

    - name: Publish GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" `
          "CyberEngineTweaks-${{ github.ref_name }}-zh-CN.zip" `
          --title "Cyber Engine Tweaks ${{ github.ref_name }} 简体中文版" `
          --notes "基于 Cyber Engine Tweaks 制作的非官方简体中文版本。下载 ZIP 后，将其中的 bin 文件夹解压到《赛博朋克 2077》游戏根目录。"